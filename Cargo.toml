[workspace]
members = ["highlight"]
resolver = "3"

[package]
name = "cargo-mdoc"
version = "0.1.0"
edition = "2024"
authors = ["copi143 <copi143@outlook.com>"]
description = "Static analysis and documentation IR generation for Rust API availability conditions"
readme = "README.md"
repository = "https://github.com/copi143/cargo-mdoc"
homepage = "https://github.com/copi143/cargo-mdoc"
keywords = ["rust", "cfg", "documentation", "analysis"]
categories = ["development-tools", "command-line-utilities", "visualization"]

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"
toml = "1.1.8"
cargo_metadata = "0.23.1"
chrono = "0.4.45"

ra_ap_syntax = "0.0.358"
ra_ap_parser = "0.0.358"
ra_ap_tt = "0.0.358"
ra_ap_cfg = { version = "0.0.358", features = ["syntax"] }
ra_ap_mbe = "0.0.358"
# Needed to convert between the syntax tree and the token trees used by
# ra_ap_mbe; it must stay in sync with the ra_ap_* versions above.
ra_ap_syntax-bridge = "0.0.358"
ra_ap_span = "0.0.358"
# ra_ap_mbe drives its expansion through a salsa database. The version is
# pinned to the one ra_ap_mbe depends on, as the API is not semver stable.
salsa = "0.28.5"

gix = "0.89.0"

highlight = { path = "highlight" }
