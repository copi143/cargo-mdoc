[workspace]
members = ["highlight"]
resolver = "3"

[package]
name = "cargo-mdoc"
version = "0.1.0"
edition = "2024"
authors = ["copi143 <copi143@outlook.com>"]
description = "Static analysis and documentation IR generation for Rust API availability conditions"
readme = "README.md"
repository = "https://github.com/copi143/cargo-mdoc"
homepage = "https://github.com/copi143/cargo-mdoc"
keywords = ["rust", "cfg", "documentation", "analysis"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
walkdir = "2.5.0"
toml = "1.1.2"
cargo_metadata = "0.23.1"
chrono = "0.4.44"

ra_ap_syntax = "0.0.333"
ra_ap_parser = "0.0.333"
ra_ap_tt = "0.0.333"
ra_ap_cfg = { version = "0.0.333", features = ["syntax"] }
ra_ap_mbe = "0.0.333"

gix = "0.83.0"

highlight = { path = "highlight" }
